<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5B9BC"/></marker></defs><rect width="1600" height="1160" fill="#F7FAF8"/><g font-family="Arial, Helvetica, sans-serif"><text x="70" y="65" font-size="20" font-weight="700" fill="#58717B">INCIDENTLAB / WORKFLOW</text><text x="70" y="132" font-size="50" font-weight="700" fill="#243C46">From a request to a decision</text><text x="70" y="179" font-size="25" font-weight="400" fill="#58717B">Real measurements → deterministic detection → incident-triggered AI</text><text x="70" y="240" font-size="21" font-weight="700" fill="#58717B">CONTINUOUS LAB LOOP · NO MODEL CALLS</text><rect x="70" y="265" width="445" height="190" rx="22" fill="#E4EFF8" stroke="#D4E1DF" stroke-width="2"/><circle cx="112" cy="308" r="24" fill="#FFFFFF"/><text x="99" y="316" font-size="22" font-weight="700" fill="#243C46">01</text><text x="148" y="316" font-size="28" font-weight="700" fill="#243C46">Scenario runner</text><text x="96" y="367" font-size="24" font-weight="400" fill="#58717B">Real HTTP requests</text><text x="96" y="400" font-size="24" font-weight="400" fill="#58717B">Warmup → fault → recovery</text><rect x="580" y="265" width="440" height="190" rx="22" fill="#E2F1E8" stroke="#D4E1DF" stroke-width="2"/><circle cx="622" cy="308" r="24" fill="#FFFFFF"/><text x="609" y="316" font-size="22" font-weight="700" fill="#243C46">02</text><text x="658" y="316" font-size="28" font-weight="700" fill="#243C46">.NET target API</text><text x="606" y="367" font-size="24" font-weight="400" fill="#58717B">Responses + JSON request logs</text><text x="606" y="400" font-size="24" font-weight="400" fill="#58717B">Process CPU and memory</text><rect x="1085" y="265" width="445" height="190" rx="22" fill="#FBF0D8" stroke="#D4E1DF" stroke-width="2"/><circle cx="1127" cy="308" r="24" fill="#FFFFFF"/><text x="1114" y="316" font-size="22" font-weight="700" fill="#243C46">03</text><text x="1163" y="316" font-size="28" font-weight="700" fill="#243C46">Rule analyzer</text><text x="1111" y="367" font-size="24" font-weight="400" fill="#58717B">Recent telemetry window</text><text x="1111" y="400" font-size="24" font-weight="400" fill="#58717B">Thresholds + event IDs</text><path d="M 515 360 H 568" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1020 360 H 1073" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1310 455 V 499 H 45 V 670 H 58" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="70" y="535" font-size="21" font-weight="700" fill="#58717B">ONE ADMITTED INCIDENT · ONE BOUNDED JOB</text><rect x="70" y="567" width="330" height="205" rx="22" fill="#FBF0D8" stroke="#D4E1DF" stroke-width="2"/><circle cx="112" cy="610" r="24" fill="#FFFFFF"/><text x="99" y="618" font-size="22" font-weight="700" fill="#243C46">04</text><text x="148" y="618" font-size="28" font-weight="700" fill="#243C46">Incident gate</text><text x="96" y="669" font-size="24" font-weight="400" fill="#58717B">Manual or opt-in auto</text><text x="96" y="702" font-size="24" font-weight="400" fill="#58717B">Capture evidence</text><text x="96" y="735" font-size="24" font-weight="400" fill="#58717B">Freeze role settings</text><rect x="450" y="567" width="330" height="205" rx="22" fill="#EEE9F8" stroke="#D4E1DF" stroke-width="2"/><circle cx="492" cy="610" r="24" fill="#FFFFFF"/><text x="479" y="618" font-size="22" font-weight="700" fill="#243C46">05</text><text x="528" y="618" font-size="28" font-weight="700" fill="#243C46">Investigator</text><text x="476" y="669" font-size="24" font-weight="400" fill="#58717B">Compare before / during</text><text x="476" y="702" font-size="24" font-weight="400" fill="#58717B">Explain likely causes</text><text x="476" y="735" font-size="24" font-weight="400" fill="#58717B">Propose checks + fixes</text><rect x="830" y="567" width="330" height="205" rx="22" fill="#EEE9F8" stroke="#D4E1DF" stroke-width="2"/><circle cx="872" cy="610" r="24" fill="#FFFFFF"/><text x="859" y="618" font-size="22" font-weight="700" fill="#243C46">06</text><text x="908" y="618" font-size="28" font-weight="700" fill="#243C46">Manager</text><text x="856" y="669" font-size="24" font-weight="400" fill="#58717B">What should happen?</text><text x="856" y="702" font-size="24" font-weight="400" fill="#58717B">Propose escalation</text><text x="856" y="735" font-size="24" font-weight="400" fill="#58717B">Draft a notification</text><rect x="1210" y="567" width="320" height="205" rx="22" fill="#E2F1E8" stroke="#D4E1DF" stroke-width="2"/><circle cx="1252" cy="610" r="24" fill="#FFFFFF"/><text x="1239" y="618" font-size="22" font-weight="700" fill="#243C46">07</text><text x="1288" y="618" font-size="28" font-weight="700" fill="#243C46">Server policy</text><text x="1236" y="669" font-size="24" font-weight="400" fill="#58717B">Validate + enforce</text><text x="1236" y="702" font-size="24" font-weight="400" fill="#58717B">Human review if needed</text><text x="1236" y="735" font-size="24" font-weight="400" fill="#58717B">Internal lab inbox</text><path d="M 400 671 H 438" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 780 671 H 818" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1160 630 H 1198" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><rect x="450" y="827" width="330" height="150" rx="22" fill="#EEE9F8" stroke="#D4E1DF" stroke-width="2"/><text x="476" y="867" font-size="23" font-weight="700" fill="#243C46">Optional diagnostic check</text><text x="476" y="907" font-size="22" font-weight="400" fill="#58717B">One frozen-data check</text><text x="476" y="939" font-size="22" font-weight="400" fill="#58717B">One follow-up model call</text><path d="M 570 772 V 815" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 670 827 V 784" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><rect x="830" y="827" width="330" height="150" rx="22" fill="#EEE9F8" stroke="#D4E1DF" stroke-width="2"/><text x="856" y="867" font-size="25" font-weight="700" fill="#243C46">Optional Judge</text><text x="856" y="907" font-size="22" font-weight="400" fill="#58717B">Review before delivery</text><text x="856" y="939" font-size="22" font-weight="400" fill="#58717B">One additional model call</text><path d="M 995 772 V 815" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1160 903 H 1368 V 784" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="70" y="856" font-size="29" font-weight="700" fill="#243C46">0 model calls</text><text x="70" y="893" font-size="29" font-weight="700" fill="#243C46">while idle</text><text x="70" y="943" font-size="23" font-weight="400" fill="#58717B">Budget checked per call</text><text x="70" y="1033" font-size="25" font-weight="700" fill="#243C46">2 base calls + 1 optional diagnostic follow-up + 1 optional Judge = at most 4 calls per job.</text><text x="70" y="1075" font-size="23" font-weight="400" fill="#58717B">Checks use captured telemetry, not arbitrary live queries. No automatic remediation.</text><text x="70" y="1109" font-size="23" font-weight="400" fill="#58717B">Delivery: internal lab inbox. External Slack / Telegram / email adapters are not implemented.</text></g></svg>