<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5B9BC"/></marker></defs><rect width="1600" height="1160" fill="#F7FAF8"/><g font-family="Arial, Helvetica, sans-serif"><text x="70" y="65" font-size="20" font-weight="700" fill="#58717B">INCIDENTLAB / AWS + BEDROCK</text><text x="70" y="132" font-size="50" font-weight="700" fill="#243C46">Two hosts. One bounded AI workflow.</text><text x="70" y="179" font-size="25" font-weight="400" fill="#58717B">Application hosts in Milan · protected sharing · AI executes from the Monitor</text><rect x="70" y="240" width="300" height="150" rx="22" fill="#E4EFF8" stroke="#D4E1DF" stroke-width="2"/><text x="98" y="285" font-size="29" font-weight="700" fill="#243C46">Shared browser</text><text x="98" y="330" font-size="22" font-weight="400" fill="#58717B">HTTPS access</text><text x="98" y="362" font-size="22" font-weight="400" fill="#58717B">No direct host access</text><rect x="470" y="240" width="490" height="150" rx="22" fill="#E4EFF8" stroke="#D4E1DF" stroke-width="2"/><text x="498" y="285" font-size="29" font-weight="700" fill="#243C46">CloudFront + WAF</text><text x="498" y="330" font-size="22" font-weight="400" fill="#58717B">CAPTCHA + request filtering</text><text x="498" y="362" font-size="22" font-weight="400" fill="#58717B">Global edge · private VPC origin</text><path d="M 370 312 H 458" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="384" y="295" font-size="20" font-weight="700" fill="#243C46">443</text><text x="1045" y="278" font-size="21" font-weight="700" fill="#58717B">PUBLIC ACCESS</text><text x="1045" y="321" font-size="23" font-weight="400" fill="#58717B">Gateway login · 1-hour sessions</text><text x="1045" y="355" font-size="23" font-weight="400" fill="#58717B">Guests: read-only</text><text x="1045" y="389" font-size="23" font-weight="400" fill="#58717B">Master: bounded experiments</text><rect x="470" y="455" width="1060" height="480" rx="22" fill="#FFFFFF" stroke="#D4E1DF" stroke-width="2"/><text x="1010" y="490" font-size="21" font-weight="700" fill="#58717B">LAB VPC / SUBNET · eu-south-1</text><rect x="500" y="520" width="535" height="370" rx="22" fill="#E2F1E8" stroke="#D4E1DF" stroke-width="2"/><text x="528" y="562" font-size="31" font-weight="700" fill="#243C46">Monitor EC2</text><text x="528" y="598" font-size="23" font-weight="400" fill="#58717B">t3.large · Docker Compose</text><text x="528" y="640" font-size="23" font-weight="400" fill="#58717B">Gateway :8020 → Monitor :8010</text><text x="528" y="674" font-size="23" font-weight="400" fill="#58717B">ASP.NET Core + React console</text><text x="528" y="708" font-size="23" font-weight="400" fill="#58717B">Rules + jobs + C# Bedrock executor</text><rect x="525" y="757" width="225" height="102" rx="22" fill="#FFFFFF" stroke="#D4E1DF" stroke-width="2"/><text x="545" y="794" font-size="25" font-weight="700" fill="#243C46">PostgreSQL</text><text x="545" y="830" font-size="19" font-weight="400" fill="#58717B">State / jobs / reports</text><rect x="773" y="757" width="237" height="102" rx="22" fill="#FFFFFF" stroke="#D4E1DF" stroke-width="2"/><text x="793" y="794" font-size="25" font-weight="700" fill="#243C46">OpenSearch</text><text x="793" y="830" font-size="19" font-weight="400" fill="#58717B">Telemetry · self-hosted</text><rect x="1145" y="520" width="355" height="370" rx="22" fill="#FBF0D8" stroke="#D4E1DF" stroke-width="2"/><text x="1173" y="562" font-size="31" font-weight="700" fill="#243C46">Target EC2</text><text x="1173" y="598" font-size="23" font-weight="400" fill="#58717B">t3.small · .NET 8</text><text x="1173" y="650" font-size="23" font-weight="400" fill="#58717B">GET /items</text><text x="1173" y="689" font-size="23" font-weight="400" fill="#58717B">POST /commands</text><text x="1173" y="728" font-size="23" font-weight="400" fill="#58717B">POST /compute</text><text x="1173" y="767" font-size="23" font-weight="400" fill="#58717B">Bounded fault controls</text><text x="1173" y="806" font-size="23" font-weight="400" fill="#58717B">Process telemetry</text><path d="M 715 390 V 507" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="730" y="426" font-size="21" font-weight="700" fill="#243C46">Private origin → 8020</text><path d="M 1035 629 H 1133" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="1049" y="610" font-size="20" font-weight="700" fill="#243C46">8080</text><path d="M 1145 826 H 1047" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="1049" y="807" font-size="20" font-weight="700" fill="#243C46">8010</text><rect x="70" y="520" width="300" height="155" rx="22" fill="#E4EFF8" stroke="#D4E1DF" stroke-width="2"/><text x="98" y="563" font-size="27" font-weight="700" fill="#243C46">Owner’s computer</text><text x="98" y="606" font-size="22" font-weight="400" fill="#58717B">Browser + AWS CLI</text><text x="98" y="639" font-size="22" font-weight="400" fill="#58717B">Private SSM access</text><path d="M 370 594 H 488" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="396" y="575" font-size="20" font-weight="700" fill="#243C46">SSM</text><rect x="70" y="752" width="300" height="223" rx="22" fill="#EEE9F8" stroke="#D4E1DF" stroke-width="2"/><text x="98" y="795" font-size="28" font-weight="700" fill="#243C46">Amazon Bedrock</text><text x="98" y="836" font-size="22" font-weight="400" fill="#58717B">Nova Lite</text><text x="98" y="869" font-size="22" font-weight="400" fill="#58717B">EU inference profile</text><text x="98" y="902" font-size="22" font-weight="400" fill="#58717B">Evidence → report</text><text x="98" y="935" font-size="22" font-weight="400" fill="#58717B">No Mac worker required</text><path d="M 500 710 H 409 V 848 H 382" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="75" y="725" font-size="20" font-weight="700" fill="#58717B">IAM role · HTTPS model calls</text><text x="500" y="916" font-size="21" font-weight="400" fill="#58717B">Traffic and fault controls → Target    |    Authenticated telemetry → Monitor</text><text x="70" y="1034" font-size="23" font-weight="400" fill="#58717B">CloudFormation provisions the hosts; SSM installs the services. No public SSH or database ports.</text><text x="70" y="1074" font-size="23" font-weight="400" fill="#58717B">Bedrock may process within the EU outside Milan. Codex on a Mac remains an alternative provider.</text><text x="70" y="1114" font-size="23" font-weight="400" fill="#58717B">AI runs only for admitted incidents. Budget checks precede every model call; no automatic remediation.</text></g></svg>