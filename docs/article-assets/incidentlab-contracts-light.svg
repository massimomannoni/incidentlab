<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A5B9BC"/></marker></defs><rect width="1600" height="1110" fill="#F7FAF8"/><g font-family="Arial, Helvetica, sans-serif"><text x="70" y="65" font-size="20" font-weight="700" fill="#58717B">INCIDENTLAB / AGENT CONTRACTS</text><text x="70" y="132" font-size="50" font-weight="700" fill="#243C46">Markdown explains. Code enforces.</text><text x="70" y="179" font-size="25" font-weight="400" fill="#58717B">The documents guide implementation; they are not automatically loaded as runtime prompts.</text><rect x="70" y="254" width="650" height="547" rx="22" fill="#E4EFF8" stroke="#D4E1DF" stroke-width="2"/><text x="103" y="304" font-size="31" font-weight="700" fill="#243C46">01  Design + runbooks</text><text x="103" y="346" font-size="23" font-weight="400" fill="#58717B">Read by humans and the coding assistant</text><text x="103" y="410" font-size="27" font-weight="700" fill="#243C46">docs/architecture.md</text><text x="103" y="444" font-size="23" font-weight="400" fill="#58717B">Component boundaries and data flow</text><text x="103" y="504" font-size="27" font-weight="700" fill="#243C46">docs/ai-worker.md</text><text x="103" y="538" font-size="23" font-weight="400" fill="#58717B">Worker setup and escalation contract</text><text x="103" y="598" font-size="27" font-weight="700" fill="#243C46">docs/verification.md</text><text x="103" y="632" font-size="23" font-weight="400" fill="#58717B">Experiments, results and known limits</text><text x="103" y="692" font-size="27" font-weight="700" fill="#243C46">SECURITY.md</text><text x="103" y="726" font-size="23" font-weight="400" fill="#58717B">Laboratory security boundaries</text><rect x="823" y="254" width="707" height="547" rx="22" fill="#EEE9F8" stroke="#D4E1DF" stroke-width="2"/><text x="857" y="304" font-size="31" font-weight="700" fill="#243C46">02  Executable contracts</text><text x="857" y="346" font-size="23" font-weight="400" fill="#58717B">The runtime behaviour lives here</text><text x="857" y="401" font-size="28" font-weight="700" fill="#243C46">AgentPrompts.cs</text><text x="857" y="436" font-size="23" font-weight="400" fill="#58717B">Shared role instructions + untrusted evidence</text><text x="857" y="493" font-size="28" font-weight="700" fill="#243C46">BedrockExecutor.cs</text><text x="857" y="528" font-size="23" font-weight="400" fill="#58717B">AWS inference + bounded role execution</text><text x="857" y="585" font-size="28" font-weight="700" fill="#243C46">CodexInvocation.cs</text><text x="857" y="620" font-size="23" font-weight="400" fill="#58717B">Alternative: Codex worker on the Mac</text><text x="857" y="677" font-size="28" font-weight="700" fill="#243C46">Contracts.cs + Agents.cs</text><text x="857" y="712" font-size="23" font-weight="400" fill="#58717B">Schemas + evidence references + server policy</text><text x="857" y="746" font-size="23" font-weight="400" fill="#58717B">The Manager proposes; the server decides.</text><path d="M 720 525 H 811" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="742" y="487" font-size="20" font-weight="700" fill="#58717B">guide</text><text x="70" y="870" font-size="21" font-weight="700" fill="#58717B">RUNTIME DATA PATH</text><rect x="70" y="902" width="387" height="113" rx="22" fill="#FBF0D8" stroke="#D4E1DF" stroke-width="2"/><text x="94" y="945" font-size="27" font-weight="700" fill="#243C46">HTTP endpoints</text><text x="94" y="984" font-size="22" font-weight="400" fill="#58717B">LabApplication.cs · Minimal APIs</text><rect x="535" y="902" width="450" height="113" rx="22" fill="#EEE9F8" stroke="#D4E1DF" stroke-width="2"/><text x="559" y="945" font-size="27" font-weight="700" fill="#243C46">Job → evidence → AI</text><text x="559" y="984" font-size="22" font-weight="400" fill="#58717B">Agents.cs → provider executor</text><rect x="1063" y="902" width="467" height="113" rx="22" fill="#E2F1E8" stroke="#D4E1DF" stroke-width="2"/><text x="1087" y="945" font-size="27" font-weight="700" fill="#243C46">Validated report + decision</text><text x="1087" y="984" font-size="22" font-weight="400" fill="#58717B">Persisted in SQL and shown in the UI</text><path d="M 457 958 H 523" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 985 958 H 1051" fill="none" stroke="#A5B9BC" stroke-width="3"  marker-end="url(#arrow)"/><text x="70" y="1070" font-size="22" font-weight="400" fill="#58717B">Target HTTP routes live in target/Program.cs. Minimal APIs use MapGet / MapPost, not MVC controllers.</text></g></svg>